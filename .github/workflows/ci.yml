name: Regression CI

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "websockets==16.0" "aiohttp==3.13.3"
      - name: Run Python regression suite
        run: python -m unittest discover -v

  javascript:
    name: Node 22 extension smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all extension smoke suites
        working-directory: snapgent-extension
        shell: bash
        run: |
          set -euo pipefail
          shopt -s failglob
          for test in test-*.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
